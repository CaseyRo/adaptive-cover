name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # No schedule: GitHub auto-disables any workflow containing one after
  # 60 days of repository inactivity — and a disabled workflow stops
  # answering push and pull_request too. That is what took this one out
  # on 2026-08-19; nothing had validated the repo since.

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
