name: pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --group test --python 3.13 pytest -q
