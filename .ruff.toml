# Based on https://github.com/home-assistant/core/blob/dev/pyproject.toml
target-version = "py312"
line-length = 88

[lint]
select = ["ALL"]
ignore = [
    "ANN",     # flake8-annotations (HA custom components are loosely typed)
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ARG002",  # Unused method argument (HA override signatures, e.g. **kwargs)
    "ARG004",  # Unused static method argument
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "D102",    # Undocumented public method (HA entity overrides)
    "D107",    # Undocumented __init__
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D212",    # Multi-line docstring summary should start at the first line
    "D213",    # ...should start at the second line (mutually exclusive with D212)
    "D401",    # First line of docstring should be in imperative mood
    "E501",    # line too long (handled by formatter)
    "EM101",   # Raw string in exception (HA pattern)
    "EM102",   # f-string in exception (HA pattern)
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default value in function definition
    "FBT003",  # Boolean positional value in call (HA service/issue helpers)
    "PLC0415", # import outside top-level (deliberate lazy astral import)
    "PLR0913", # Too many arguments to function call (N > 5)
    "PLR2004", # Magic value used in comparison
    "RUF001",  # Ambiguous unicode in string (γ, °, ≥ are intentional)
    "RUF002",  # Ambiguous unicode in docstring
    "RUF003",  # Ambiguous unicode in comment
    "S101",    # Use of assert detected
    "SLF001",  # Private member access (coordinator<->switch wiring, tests)
    "TC001",   # typing-only first-party import
    "TC002",   # typing-only third-party import
    "TC003",   # typing-only standard-library import
    "TRY003",  # Long messages outside the exception class
]

[lint.isort]
known-first-party = ["adaptive_cover"]

[lint.per-file-ignores]
"tests/*.py" = [
    "ANN",
    "D100",
    "D103",
    "ERA001",  # commented-out code (illustrative day-track comments)
    "INP001",  # File is part of an implicit namespace package
    "PT018",   # composite assertions are fine in these tests
    "S101",
]
